<aside class="sidebar glass-card" [class.open]="isOpen">
  <div class="sidebar-brand">
    <div class="logo-small">
      <span class="icon">
        <img src="favicon.ico" alt="fav">
      </span>
    </div>
    <button mat-icon-button class="btn-close-sidebar show-mobile" (click)="onLinkClick()">
      <mat-icon>close</mat-icon>
    </button>
  </div>
  <nav class="sidebar-nav">
    <a routerLink="/dashboard/medicos" routerLinkActive="active" class="nav-item" (click)="onLinkClick()">
      <mat-icon>medical_services</mat-icon>
      <span>Médicos</span>
    </a>
    <a routerLink="/dashboard/pacientes" routerLinkActive="active" class="nav-item" (click)="onLinkClick()">
      <mat-icon>hotel</mat-icon>
      <span>Pacientes</span>
    </a>
    <a routerLink="/dashboard/consultas" routerLinkActive="active" class="nav-item" (click)="onLinkClick()">
      <mat-icon>calendar_month</mat-icon>
      <span>Consultas</span>
    </a>
  </nav>
  <div class="sidebar-footer">
    <button mat-flat-button color="warn" class="btn-logout" (click)="onLogout()">
      <mat-icon>logout</mat-icon>
      Sair
    </button>
  </div>
</aside>
