@if (isVisible) {
  <div class="modal-backdrop fade-in">
    <div class="modal-dialog glass-card animate-fade-in">
      <div class="modal-header">
        <h3 style="margin: 0; display: flex; align-items: center; gap: 0.5rem;">
          <mat-icon style="color: var(--danger)">warning</mat-icon> {{ title }}
        </h3>
        <button mat-icon-button (click)="onCancel()" aria-label="Close modal">
          <mat-icon>close</mat-icon>
        </button>
      </div>
      
      <div class="modal-body">
        <p>{{ message }}</p>
      </div>
      
      <div class="modal-footer">
        <button mat-stroked-button (click)="onCancel()">
          Cancelar
        </button>
        <button mat-flat-button color="warn" (click)="onConfirm()">
          <mat-icon>delete</mat-icon>
          Confirmar
        </button>
      </div>
    </div>
  </div>
}
