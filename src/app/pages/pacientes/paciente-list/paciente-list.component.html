<div class="page-header flex flex-col flex-md-row justify-between items-center gap-4 mb-4">
  <h2>Pacientes</h2>
  <a mat-flat-button color="primary" routerLink="/dashboard/pacientes/novo">
    <mat-icon>add</mat-icon> Novo Paciente
  </a>
</div>

<mat-card class="glass-card table-container">
  <mat-card-content>
    <div *ngIf="isLoading" class="text-center spinner-container">
      <mat-spinner diameter="40"></mat-spinner>
      <span>Carregando...</span>
    </div>
    
    <table class="table" *ngIf="!isLoading && pacientes.length > 0">
      <thead>
        <tr>
          <th>Nome</th>
          <th>Email</th>
          <th>CPF</th>
          <th>Telefone</th>
          <th>Ações</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let paciente of pacientes">
          <td>{{ paciente.nome }}</td>
          <td>{{ paciente.email }}</td>
          <td>{{ paciente.cpf }}</td>
          <td>{{ paciente.telefone }}</td>
          <td class="flex gap-2">
            <button mat-icon-button color="primary" (click)="editarPaciente(paciente.id)" matTooltip="Editar">
              <mat-icon>edit</mat-icon>
            </button>
            <button mat-icon-button color="warn" (click)="excluirPaciente(paciente.id)" matTooltip="Excluir">
              <mat-icon>delete</mat-icon>
            </button>
          </td>
        </tr>
      </tbody>
    </table>

    <div *ngIf="!isLoading && pacientes.length === 0" class="text-center text-muted empty-state">
      <mat-icon class="empty-icon">people_outline</mat-icon>
      <p>Nenhum paciente cadastrado.</p>
    </div>
  </mat-card-content>
</mat-card>

<app-confirm-modal
  [isVisible]="showConfirmModal"
  title="Excluir Paciente"
  message="Tem certeza que deseja excluir permanentemente este paciente?"
  (confirm)="confirmarExclusao()"
  (cancel)="cancelarExclusao()">
</app-confirm-modal>
